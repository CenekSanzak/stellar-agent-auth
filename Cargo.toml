[workspace]
resolver = "2"
members = [
    "contracts/agent-registry",
    "contracts/verification-registry",
    "contracts/smart-wallet",
    "contracts/demo-service",
    "contracts/shared-types",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
publish = false

[workspace.dependencies]
soroban-sdk = "=29.0.1"
stellar-agent-auth-shared-types = { path = "contracts/shared-types" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
