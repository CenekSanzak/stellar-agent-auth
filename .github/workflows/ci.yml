name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup show
      - name: Cache pinned Stellar CLI
        id: stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-30.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Stellar CLI build dependencies
        if: steps.stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libdbus-1-dev pkg-config
      - name: Install pinned Stellar CLI
        if: steps.stellar-cli.outputs.cache-hit != 'true'
        run: cargo install stellar-cli --version 30.0.1 --locked
      - run: stellar --version
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            !target/wasm32v1-none/release/stellar_agent_auth_probe.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: auth-probe-wasm
          path: target/wasm32v1-none/release/stellar_agent_auth_probe.wasm
          if-no-files-found: error
  local-network:
    needs: foundation
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release
      - uses: actions/download-artifact@v4
        with:
          name: auth-probe-wasm
          path: target/wasm32v1-none/release
      - run: npm run build
      - run: npm run dev
      - run: npm run test:integration
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: npm run local:down
