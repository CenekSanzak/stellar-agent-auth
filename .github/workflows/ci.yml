name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: rustup show
      - name: Cache pinned Stellar CLI
        id: stellar-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/stellar
          key: stellar-cli-30.0.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install Stellar CLI build dependencies
        if: steps.stellar-cli.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev libdbus-1-dev pkg-config
      - name: Install pinned Stellar CLI
        if: steps.stellar-cli.outputs.cache-hit != 'true'
        run: cargo install stellar-cli --version 30.0.1 --locked
      - run: stellar --version
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            !target/wasm32v1-none/release/stellar_agent_auth_probe.wasm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: auth-probe-wasm
          path: target/wasm32v1-none/release/stellar_agent_auth_probe.wasm
          if-no-files-found: error
  local-network:
    needs: foundation
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release
      - uses: actions/download-artifact@v4
        with:
          name: auth-probe-wasm
          path: target/wasm32v1-none/release
      - run: npm run build
      - run: npm run dev
      - run: npm run test:integration
      # The demo in the runner's own Chrome; nothing is downloaded.
      - run: npm run test:browser
      # The image the hosted demo runs from must keep building.
      - run: docker build -t scout-demo .
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: npm run local:down
  # Public Testnet, read-only: the compatibility preflight and the check of the kept deployment against the
  # network. It needs no secret and makes no transaction. It runs only when the workflow is started by hand, so
  # that a faucet or RPC outage cannot fail a merge.
  testnet:
    if: github.event_name == 'workflow_dispatch'
    needs: foundation
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: target/wasm32v1-none/release
      - run: npm run build
      - run: npm run test:testnet
        env:
          RUN_TESTNET_TESTS: '1'
      - run: node deployments/testnet/deploy.ts
      - uses: actions/upload-artifact@v4
        with:
          name: testnet-manifest
          path: deployments/testnet/manifest.json
          if-no-files-found: error
