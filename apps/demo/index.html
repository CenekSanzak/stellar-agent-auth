<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Scout: a research agent that pays from your wallet, inside an allowance you set. A demo of agent payments on Stellar." />
    <title>Scout · an agent on an allowance</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b5d4b'/%3E%3Cpath d='M16 6l3.2 6.8L26 16l-6.8 3.2L16 26l-3.2-6.8L6 16l6.8-3.2z' fill='%23f4f2ec'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body data-phase="loading">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" /><path d="M16 6l3.2 6.8L26 16l-6.8 3.2L16 26l-3.2-6.8L6 16l6.8-3.2z" /></svg>
        <span class="brand-name">Scout</span>
        <span id="network"></span>
      </div>
      <div id="account" class="account-bar"></div>
    </header>
    <main>
      <div id="notice"></div>
      <section id="welcome" aria-label="Welcome"></section>
      <section id="setup" aria-label="Set up"></section>
      <div class="board">
        <div class="col side">
          <section id="wallet" aria-label="Your wallet"></section>
          <section id="withdraw" aria-label="Withdraw"></section>
          <section id="allowance" aria-label="Scout's allowance"></section>
          <section id="allowance-form" aria-label="New allowance"></section>
          <section id="own-agents" class="stack" aria-label="Your own agents"></section>
          <section id="connect" aria-label="Use your own AI agent"></section>
          <section id="sellers" aria-label="Sellers"></section>
          <section id="scout" aria-label="Scout"></section>
        </div>
        <div class="col main">
          <section id="tasks" aria-label="Ask Scout"></section>
          <section id="activity" aria-label="Activity" aria-live="polite"></section>
          <section id="record" aria-label="The wallet's record"></section>
          <section id="details" aria-label="Under the hood"></section>
        </div>
      </div>
    </main>
    <footer id="footer"></footer>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
