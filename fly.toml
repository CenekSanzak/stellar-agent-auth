# Fly.io configuration for the hosted demo. See docs/HOSTING.md.
#
# `app` must be unique on Fly, and DEMO_PUBLIC_URL must be the address visitors use: change both together.
app = "scout-agent-demo"
# Ashburn: the lowest machine prices, which keeps this inside the Free plan's monthly usage.
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_PUBLIC_URL = "https://scout-agent-demo.fly.dev"
  # References to secrets, not secrets: each names the environment variable that `fly secrets set` fills.
  DEMO_AGENT_KEY = "env:SCOUT_AGENT_SECRET"
  DEMO_FUNDER_KEY = "env:SCOUT_FUNDER_SECRET"
  DEMO_FACILITATOR_KEY = "env:SCOUT_FACILITATOR_SECRET"
  # With the provider's key the server verifies agents people bring, and keeps Scout's verification current.
  DEMO_PROVIDER_KEY = "env:SCOUT_PROVIDER_SECRET"
  # Let the server use most of the machine's 512 MB before it gives up; the default stops near 256 MB.
  NODE_OPTIONS = "--max-old-space-size=320"

# The indexer's database. RPC servers keep only a window of recent events, so this file is the history.
[mounts]
  source = "scout_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # One small machine that stays up: the indexer keeps reading, and a visitor never waits for a start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
