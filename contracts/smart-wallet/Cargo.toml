[package]
name = "stellar-agent-auth-smart-wallet"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true
stellar-agent-auth-shared-types.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-agent-auth-agent-registry = { path = "../agent-registry" }
stellar-agent-auth-verification-registry = { path = "../verification-registry" }
